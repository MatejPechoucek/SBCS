comes from the market (bazaar instant\nsell, else lowest BIN). When an item has no market price, it falls back to\nthe wiki's added cost. The chest costs its base price plus its items' added\ncosts. Tests default to the floor's best chest that exists (Obsidian below\nFloor V). Dyes appear only on Master Mode. 0.3.7-alpha.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01E7NT2bvWzhacPHhWn2PixL", "f": [["CLAUDE.md", "22", "7"], ["gradle.properties", "1", "1"], ["src/main/java/com/sbcs/SbcsClient.java", "5", "6"], ["src/main/java/com/sbcs/anim/OssuaryTests.java", "119", "57"], ["src/main/java/com/sbcs/anim/OssuaryTimeline.java", "1", "1"], ["src/main/java/com/sbcs/gui/OssuaryRoll.java", "10", "3"], ["src/main/java/com/sbcs/gui/OssuaryTestScreen.java", "11", "2"], ["src/main/java/com/sbcs/gui/menu/MenuView.java", "2", "2"], ["tools/OssuaryTest.java", "44", "7"]]}, {"h": "c3a93f0e1e740de6879fd998ce19f636463c0e26", "p": ["78cbc6bbfe6616abf3d73ca68a5c87dca9b24b01"], "r": [], "a": "Claude", "d": "2026-10-22T20:23:39Z", "s": "Ossuary: give every dungeon chest its own loot pool", "b": "Wood, Gold, Diamond and Emerald chests had no pools and borrowed Obsidian's,\nso their reels showed loot those chests never hold. The pools are now built\nper floor and per chest from the wiki's loot tables (copied as data into\ntools/fixtures/dungeon_loot), with each item's weight and added cost.\nSkyOcean's Obsidian/Bedrock pools, whose weights match the wiki's totals,\ncomplete the tables the fetch cut short. The dyes move out of the pools,\nsince Hypixel rolls them separately. DungeonChestTest checks every wiki row\nand every chest's total weight against the pool.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01E7NT2bvWzhacPHhWn2PixL", "f": [["src/main/java/com/sbcs/detect/dungeon/DungeonPool.java", "57", "20"], ["src/main/resources/assets/sbcs/dungeon_pool.json", "8153", "1571"], ["tools/DungeonChestTest.java", "65", "1"], ["tools/fixtures/dungeon_loot/F2.csv", "58", "0"], ["tools/fixtures/dungeon_loot/F7.csv", "92", "0"], ["tools/fixtures/dungeon_loot/M2.csv", "59", "0"], ["tools/fixtures/dungeon_loot/M3.csv", "72", "0"], ["tools/fixtures/dungeon_loot/M4.csv", "72", "0"], ["tools/fixtures/dungeon_loot/M5.csv", "92", "0"], ["tools/fixtures/dungeon_loot/M6.csv", "91", "0"], ["tools/fixtures/dungeon_loot/M7.csv", "83", "0"], ["tools/gen_dungeon_pool.py", "168", "23"]]}, {"h": "78cbc6bbfe6616abf3d73ca68a5c87dca9b24b01", "p": ["c0e1c183246381a74253de4c6cda763e897d3721"], "r": [], "a": "Claude", "d": "2026-10-22T19:39:38Z", "s": "Ossuary notes in CLAUDE.md; 0.3.6-alpha", "b": "Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01E7NT2bvWzhacPHhWn2PixL", "f": [["CLAUDE.md", "43", "0"], ["gradle.properties", "1", "1"]]}, {"h": "c0e1c183246381a74253de4c6cda763e897d3721", "p": ["c1b209714b8f03722485975a39f40ad00259e810"], "r": [], "a": "Claude", "d": "2026-10-22T19:39:05Z", "s": "The Ossuary: settings, menu card, Try it and /sbcs test dungeon", "b": "Config (tiers, Croesus off/best/every, chain or watch, Master Mode red chest,\nbanner, price, volume, speed, busts), a menu card with a switch per chest tier,\nstats, and made-up chests per outcome (OssuaryTests) for Try it and\n/sbcs test dungeon <floor> <outcome> [tier], played on a screen of their own.\nOssuaryTest: 242 checks (every floor's Try it plays the band it names).\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01E7NT2bvWzhacPHhWn2PixL", "f": [["src/main/java/com/sbcs/SbcsClient.java", "43", "0"], ["src/main/java/com/sbcs/anim/OssuaryTests.java", "100", "0"], ["src/main/java/com/sbcs/config/PatternConfig.java", "26", "0"], ["src/main/java/com/sbcs/gui/OssuaryTestScreen.java", "81", "0"], ["src/main/java/com/sbcs/gui/menu/MenuView.java", "51", "1"], ["tools/OssuaryTest.java", "20", "0"]]}, {"h": "c1b209714b8f03722485975a39f40ad00259e810", "p": ["fb2f437f755e0d88baafe3681379e630de47e835"], "r": [], "a": "Claude", "d": "2026-10-22T19:39:05Z", "s": "The Ossuary in game: the roll over the reward chest's menu", "b": "DungeonRolls reads the open chest menu every tick and RollPicker decides:\nthe boss room's chest, or a run's page at Croesus (its most profitable\nunseen chest), never one that has rolled (72 h memory in\nconfig/sbcs/dungeon_rolls.json). The menu is covered from its first frame,\nits own drawing, panel, mouse and keys swallowed while the roll plays (Escape\nstill closes it); OssuaryRoll is drawn after the screen from Gui, with live\nprices. Read only: nothing clicks a slot or sends a packet. The cover hooks\nare optional and the cover lifts if nothing draws it.\nDungeonChestTest: 68 checks (the picker added).\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01E7NT2bvWzhacPHhWn2PixL", "f": [["src/main/java/com/sbcs/Safety.java", "2", "1"], ["src/main/java/com/sbcs/audio/SbcsAudio.java", "4", "0"], ["src/main/java/com/sbcs/detect/dungeon/DungeonRolls.java", "325", "0"], ["src/main/java/com/sbcs/detect/dungeon/RollPicker.java", "91", "0"], ["src/main/java/com/sbcs/gui/OssuaryRoll.java", "518", "0"], ["src/main/java/com/sbcs/mixin/ChestBackgroundMixin.java", "19", "0"], ["src/main/java/com/sbcs/mixin/ContainerCoverMixin.java", "56", "0"], ["src/main/java/com/sbcs/mixin/GuiOssuaryMixin.java", "48", "0"], ["src/main/java/com/sbcs/mixin/HudHiddenMixin.java", "2", "0"], ["src/main/resources/sbcs.mixins.json", "4", "1"], ["tools/DungeonChestTest.java", "34", "0"]]}, {"h": "fb2f437f755e0d88baafe3681379e630de47e835", "p": ["47255fa506138f953696d6958eb928d83eac522d"], "r": [], "a": "Claude", "d": "2026-10-22T19:28:05Z", "s": "The Ossuary: its sounds, and the dealers' heads", "b": "OssuarySound follows the roll as it .java", "1", "0"], ["src/main/java/com/sbcs/detect/SeraphWatcher.java", "1", "0"], ["src/main/java/com/sbcs/detect/SharkWatcher.java", "1", "0"], ["src/main/java/com/sbcs/detect/nucleus/BundleSpotter.java", "23", "3"], ["src/main/java/com/sbcs/render/ScathaSkins.java", "1", "1"], ["tools/ChatSpoofTest.java", "140", "0"], ["tools/FrameBudgetTest.java", "127", "0"], ["tools/LocaleTest.java", "32", "0"], ["tools/SafetyTest.java", "47", "0"]]}, {"h": "69034b81c7bf02a51456557e1ae28e6a5d289cbd", "p": ["e7bb28eb4ff221f7d3cfa57b286bd6bde72188e3"], "r": ["claude/project-thread-94aygr"], "a": "Claude", "d": "2026-10-23T18:42:26Z", "s": "Count every cutscene's GUI calls a frame, every ending", "b": "FrameBudgetTest draws Diana, Hellion, the Seraph and the Vault frame by frame\nfor every ending and fails on any frame over 6,000 GUI calls. Pixel-layer\nsquares are counted apart, as they go into one image. Worst today: the\nSeraph's Dragon at 4,564 (the grey world's gild); everything else under 2,500.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["tools/FrameBudgetTest.java", "127", "0"]]}, {"h": "e7bb28eb4ff221f7d3cfa57b286bd6bde72188e3", "p": ["4407b13e77ebc488feff018e237965bccfa9d79c"], "r": [], "a": "Claude", "d": "2026-10-23T18:38:03Z", "s": "Nucleus cover: prefer the dropped head, and only stop when the bundle goes", "b": "BundleSpotter scored every new item on the floor the same (2), and stopped\ncovering as soon as whatever it followed vanished. Someone else's dropped\nitem near the vault could be followed first, and when it was picked up the\ncover switched off before the bundle had even landed. A dropped player\nhead (the bundle, from Matej's first run) now scores 4 and wins over other\nitems. Only the loss of a 4-or-better entity counts as the pickup; a weaker\none going sends the box back to waiting at the drop spot. Compiled and the\nNucleus suites pass; not yet seen in game.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/detect/nucleus/BundleSpotter.java", "23", "3"]]}, {"h": "4407b13e77ebc488feff018e237965bccfa9d79c", "p": ["7c636d09c81db570f529b15e047d6dca52196c06"], "r": [], "a": "Claude", "d": "2026-10-23T18:34:48Z", "s": "Drop a synth block holding NaN instead of silencing the synth for good", "b": "A single NaN or infinity from any voice went into the reverb's feedback\nlines and stayed there: every block after it came out NaN, which pcm()\nturns into 0, so all synthesised sound went silent until something called\nsilence(). The mix is now checked once a block (512 multiplies per buffer)\nand a bad block is zeroed with the reverb reset. SafetyTest checks the\ncheck.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/audio/SynthEngine.java", "16", "0"], ["tools/SafetyTest.java", "17", "1"]]}, {"h": "7c636d09c81db570f529b15e047d6dca52196c06", "p": ["f59cec1278f94dd9d9233e18ced8dac2291ffea6"], "r": [], "a": "Claude", "d": "2026-10-23T18:32:09Z", "s": "Count a Diana kill whose waiting bust is dropped", "b": "A Diana bust that arrived while another cutscene played waited in line,\nand after five seconds was dropped without its kill reaching the stats.\nopenChop counts the kill when the screen opens, so a dropped one was never\ncounted, and the dry streak and Ledger missed it. The lava, Seraph and\nblaze listeners already passed a callback for this; Diana's now does too.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/SbcsClient.java", "3", "1"]]}, {"h": "f59cec1278f94dd9d9233e18ced8dac2291ffea6", "p": ["4710926e07a1d0c6f2b5dba1654067bd20920518"], "r": [], "a": "Claude", "d": "2026-10-23T18:32:09Z", "s": "Read each inventory stack's SkyBlock data once, not every tick", "b": "HotbarDropWatcher deep-copied every stack's NBT (copyTag) and parsed every\npet's JSON 20 times a second, all through play. Item components are\nimmutable, so a stack that has not changed keeps the same CustomData\ninstance: what was read from it last tick is reused, keyed by identity.\nThe diff itself still runs every tick, as CLAUDE.md requires. The pet's\ntype and tier are upper-cased in the root locale too.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/detect/HotbarDropWatcher.java", "38", "12"]]}, {"h": "4710926e07a1d0c6f2b5dba1654067bd20920518", "p": ["37018d40206ada3cc434228ba90039a0ed684866"], "r": [], "a": "Claude", "d": "2026-10-23T18:32:09Z", "s": "Lower-case rarities in the root locale, not the player's", "b": "In Turkish, \"EPIC\".toLowerCase() is \"epıc\" with a dotless i, which matches\nno rarity anywhere: an epic Scatha pet lost its colour, sound and stats\nline for anyone playing in Turkish. DropResult.pet and the skins status line\nnow use Locale.ROOT, as the rest of the code already does.\ntools/LocaleTest runs under tr-TR and checks every pet rarity.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/detect/DropDetector.java", "1", "1"], ["src/main/java/com/sbcs/render/ScathaSkins.java", "1", "1"], ["tools/LocaleTest.java", "32", "0"]]}, {"h": "37018d40206ada3cc434228ba90039a0ed684866", "p": ["000b7da899655473c9d6f02ee4e49a809ce87403"], "r": [], "a": "Claude", "d": "2026-10-23T18:30:49Z", "s": "Count only hypixel.net and its subdomains as Hypixel", "b": "onHypixel() checked whether the server address contained \"hypixel.net\", so\n\"hypixel.net.example.com\" or \"nothypixel.net\" turned detection on, and any\nserver could feed it lookalike nametags and lines. It now compares the host\n(port and trailing dot removed) with hypixel.net or *.hypixel.net.\ntools/SafetyTest checks 17 addresses.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/Safety.java", "14", "1"], ["tools/SafetyTest.java", "31", "0"]]}, {"h": "000b7da899655473c9d6f02ee4e49a809ce87403", "p": ["5725c565056e99607bb405f46be085af722c22f6"], "r": [], "a": "Claude", "d": "2026-10-23T18:30:21Z", "s": "Ignore lines other players typed before any watcher reads them", "b": "Hypixel sends players' chat as game messages, so Fabric's player/game split\nnever filters it there. Most drop lines are matched from their start and\nwere safe, but Diana's dig line and lava catch lines are found anywhere in\nthe line: \"[MVP+] Someone: Oi! You dug out a Minos Inquisitor!\" made the\nnext Inquisitor nametag nearby ours, and a typed Thunder catch line claimed\nsomeone else's Thunder.\n\ndetect/ChatLines recognises a player's line by its sender prefix (channel,\nrank and level tags, emblems, name, \": \"). Every watcher's onChatLine drops\nsuch lines first. tools/ChatSpoofTest (140 checks) checks that the real\nlines from the records, the Nucleus fixture, Feesh's rewrites and\nRagnarok's colon line are still read, and that typed digs, catches and\ndrops in every channel open nothing. It fails without the fix.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01LrVKSmQwj6kAEwNwy3ybWs", "f": [["src/main/java/com/sbcs/SbcsClient.java", "3", "2"], ["src/main/java/com/sbcs/detect/ChatLines.java", "41", "0"], ["src/main/java/com/sbcs/detect/DianaWatcher.java", "1", "0"], ["src/main/java/com/sbcs/detect/HellionWatcher.java", "1", "0"], ["src/main/java/com/sbcs/detect/LavaWatcher.java", "1", "0"], ["src/main/java/com/sbcs/detect/SeraphWatcher.java", "1", "0"], ["src/main/java/com/sbcs/detect/SharkWatcher.java", "1", "0"], ["tools/ChatSpoofTest.java", "140", "0"]]}, {"h": "5725c565056e99607bb405f46be085af722c22f6", "p": ["2800dca590b5b84d47503da172750633432e55dc", "430598bb8875fa4f8c0e8d0c2fb9138a4e9cc7ab"], "r": [], "a": "Matej Pechoucek", "d": "2026-10-22T18:38:00+01:00", "s": "Merge pull request #1 from MatejPechoucek/claude/project-thread-4waafd", "b": "Add The Vault: Crystal Nucleus loot bundle animation", "f": [["CLAUDE.md", "55", "0"], ["src/main/java/com/sbcs/Safety.java", "1", "0"], ["src/main/java/com/sbcs/SbcsClient.java", "139", "3"], ["src/main/java/com/sbcs/anim/VaultTimeline.java", "538", "0"], ["src/main/java/com/sbcs/audio/SbcsAudio.java", "5", "0"], ["src/main/java/com/sbcs/audio/VaultSound.java", "133", "0"], ["src/main/java/com/sbcs/audio/Voices.java", "141", "0"], ["src/main/java/com/sbcs/config/PatternConfig.java", "15", "1"], ["src/main/java/com/sbcs/detect/DropRecorder.java", "9", "0"], ["src/main/java/com/sbcs/detect/nucleus/BundleSpotter.java", "235", "0"], ["src/main/java/com/sbcs/detect/nucleus/NucleusHaul.java", "112", "0"], ["src/main/java/com/sbcs/detect/nucleus/NucleusLoot.java", "187", "0"], ["src/main/java/com/sbcs/detect/nucleus/NucleusWatcher.java", "231", "0"], ["src/main/java/com/sbcs/gui/VaultScreen.java", "479", "0"], ["src/main/java/com/sbcs/gui/menu/MenuView.java", "28", "1"], ["src/main/java/com/sbcs/render/BundleCover.java", "79", "0"], ["src/main/java/com/sbcs/render/HeadSkins.java", "3", "0"], ["src/main/java/com/sbcs/render/VaultScene.java", "797", "0"], ["src/main/resources/assets/sbcs/nucleus_heads.json", "4", "0"], ["tools/NucleusTest.java", "140", "0"], ["tools/VaultPreview.java", "79", "0"], ["tools/VaultTest.java", "145", "0"], ["tools/fixtures/nucleus_hauls.txt", "97", "0"]]}, {"h": "430598bb8875fa4f8c0e8d0c2fb9138a4e9cc7ab", "p": ["5f98688dd2f079920b86a4b0750932f6f3b1b87d"], "r": ["claude/project-thread-4waafd"], "a": "Claude", "d": "2026-10-22T17:29:14Z", "s": "Vault: animate Divan's Alloy's pack icon instead of squeezing its strip", "b": "Hypixel's alloy icon is a 16 x 64 strip of four frames with an .mcmeta\n(frametime 6, interpolate, a frame list). Blitted as one 16 x 16 square, all\nfour frames showed stacked. Read the strip's size and .mcmeta and draw one\nframe at a time, the next fading in, as the game does.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01K66p89rZTPD6enaca516RL", "f": [["CLAUDE.md", "4", "1"], ["src/main/java/com/sbcs/gui/VaultScreen.java", "72", "2"]]}, {"h": "5f98688dd2f079920b86a4b0750932f6f3b1b87d", "p": ["7d6c8061ae9fd138cb7038abb57e7745b7ff37a5"], "r": [], "a": "Claude", "d": "2026-10-22T17:17:50Z", "s": "Vault polish: sockets clear of the bolts, longer pauses before the good drops", "b": "The upper-left socket sat under the bolts, so the amethyst crystal was\nclipped by them. The sockets move in to a ring of 5, the bolts are slimmer\nand sit across the door's edge, and the crystals fly in from the front with\na trail, drawn after everything on the door. Sockets get a brass rim and\nlight up in their crystal's colour.\n\nEvery win now holds its breath after the reveal: a rare roll unlatches a\ncrack before it swings, a Flawless gem knocks three times from inside before\nthe door blows, Divan's Alloy pours slower and holds white hot before the\nMeltdown, and the Jade Dye's frozen world gets a fourth heartbeat. Nothing\nbefore the reveal changes (VaultTest, 168 checks).\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01K66p89rZTPD6enaca516RL", "f": [["CLAUDE.md", "12", "1"], ["src/main/java/com/sbcs/anim/VaultTimeline.java", "56", "17"], ["src/main/java/com/sbcs/audio/VaultSound.java", "14", "4"], ["src/main/java/com/sbcs/audio/Voices.java", "14", "0"], ["src/main/java/com/sbcs/render/VaultScene.java", "97", "21"], ["tools/VaultTest.java", "8", "0"]]}, {"h": "7d6c8061ae9fd138cb7038abb57e7745b7ff37a5", "p": ["7a9ab1de14fc19a031d0efb69a47d90e0c8b458c"], "r": [], "a": "Claude", "d": "2026-10-22T17:05:59Z", "s": "Nucleus cover: centre on where the bundle was recorded", "b": "Matej's run recorded the bundle as a dropped Player Head item at 515 108 533,\nseen when he walked up to it.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01K66p89rZTPD6enaca516RL", "f": [["src/main/java/com/sbcs/detect/nucleus/BundleSpotter.java", "5", "4"]]}, {"h": "7a9ab1de14fc19a031d0efb69a47d90e0c8b458c", "p": ["5917a2531760734faec7e9e46335ef350e54eab1"], "r": [], "a": "Claude", "d": "2026-10-22T16:34:18Z", "s": "Nucleus cover: wider search and a bigger box", "b": "Matej's landing spot is approximate, so search 20 blocks round it (the\nclosest candidate still wins) and grow the box round a held head.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01K66p89rZTPD6enaca516RL", "f": [["src/main/java/com/sbcs/detect/nucleus/BundleSpotter.java", "4", "3"], ["src/main/java/com/sbcs/render/BundleCover.java", "2", "2"]]}, {"h": "5917a2531760734faec7e9e46335ef350e54eab1", "p": ["5b98639ef0e6fd148fc976430498bd128fdc0fee"], "r": [], "a": "Claude", "d": "2026-10-22T16:20:42Z", "s": "Nucleus cover: search where the bundle really lands", "b": "The bundle lands about 26 blocks south of Skyblocker's Nucleus waypoint\n(Matej's first run: ~513 106 551), outside the 16-block search, so nothing\nwas followed and no box was drawn. Search 12 blocks round that spot, take\nan armour stand holding a player head in any slot, prefer the closest, and\ncover where a marker stand's held head is drawn rather than its empty box.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01K66p89rZTPD6enaca5 const free = () => { const i = lanes.indexOf(null); return i < 0 ? lanes.length : i; };
DATA.forEach((c, r) => {
  const row = rows[r];
  let col = lanes.indexOf(c.h);
  if (col < 0) col = free();
  row.col = col;
  lanes.forEach((x, k) => {
    if (x === c.h) { row.segs.push({t: "in", k, col, color: laneColor[k]}); lanes[k] = null; }
    else if (x != null) row.segs.push({t: "pass", k, color: laneColor[k]});
  });
  c.p.forEach((p, pi) => {
    if (!byHash.has(p)) return;
    const j = pi === 0 && lanes[col] == null ? col : free();
    lanes[j] = p;
    laneColor[j] = pi === 0 ? c.pr.color : byHash.get(p).pr.color;
    row.segs.push({t: "out", k: j, col, color: laneColor[j]});
  });
  while (lanes.length && lanes[lanes.length - 1] == null) lanes.pop();
  row.out = lanes.map((x, k) => x != null ? {k, color: laneColor[k]} : null).filter(Boolean);
  maxLanes = Math.max(maxLanes, lanes.length, col + 1);
});
const GW = PAD + maxLanes * LANE;
const lx = k => PAD / 2 + k * LANE + LANE / 2;

function graphSvg(c, r) {
  const row = rows[r], mid = ROWH / 2, x = lx(row.col);
  let s = "";
  for (const g of row.segs) {
    if (g.t === "pass") s += `<path d="M${lx(g.k)} 0V${ROWH}" stroke="${g.color}"/>`;
    else if (g.t === "in") s += g.k === g.col ? `<path d="M${x} 0V${mid}" stroke="${g.color}"/>`
      : `<path d="M${lx(g.k)} 0C${lx(g.k)} ${mid} ${x} ${mid * .4} ${x} ${mid}" stroke="${g.color}"/>`;
    else s += g.k === g.col ? `<path d="M${x} ${mid}V${ROWH}" stroke="${g.color}"/>`
      : `<path d="M${x} ${mid}C${x} ${ROWH - mid * .4} ${lx(g.k)} ${mid} ${lx(g.k)} ${ROWH}" stroke="${g.color}"/>`;
  }
  s += c.p.length > 1
    ? `<circle cx="${x}" cy="${mid}" r="5" fill="var(--bg)" stroke="${c.pr.color}" stroke-width="2.5"/>`
    : `<circle cx="${x}" cy="${mid}" r="4.5" fill="${c.pr.color}" stroke="var(--bg)" stroke-width="1.5"/>`;
  const ext = row.out.map(o => `<path d="M${lx(o.k)} 0V100" stroke="${o.color}" vector-effect="non-scaling-stroke"/>`).join("");
  return `<svg class="top" width="${GW}" height="${ROWH}" fill="none" stroke-width="2" aria-hidden="true">${s}</svg>`
    + `<svg class="ext" viewBox="0 0 ${GW} 100" preserveAspectRatio="none" fill="none" stroke-width="2" aria-hidden="true">${ext}</svg>`;
}

// ---- Rendering
let state = {q: "", who: "", pr: null, only: false, view: "graph"};
try { const v = localStorage.getItem("sbcs-history-view"); if (v === "pr" || v === "graph") state.view = v; } catch (e) {}
const open = new Set();

function hl(text) {
  const t = esc(text);
  if (!state.q) return t;
  const re = new RegExp(state.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"), "gi");
  return t.replace(re, m => `<mark>${m}</mark>`);
}
function matches(c) {
  if (state.who && (state.who === "Claude") !== isClaude(c)) return false;
  if (state.pr && c.pr !== state.pr) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return c.h.startsWith(q) || c.s.toLowerCase().includes(q) || c.b.toLowerCase().includes(q) || c.f.some(f => f[0].toLowerCase().includes(q));
}
function fileRows(c) {
  if (!c.f.length) return `<div><span class="p">No file changes</span></div>`;
  const max = Math.max(1, ...c.f.map(f => numOr0(f[1]) + numOr0(f[2])));
  const fs = [...c.f].sort((a, b) => (numOr0(b[1]) + numOr0(b[2])) - (numOr0(a[1]) + numOr0(a[2])));
  return fs.map(([p, a, d]) => {
    const wa = a === "-" ? 0 : Math.max(a > 0 ? 1 : 0, Math.round(numOr0(a) / max * 80)), wd = d === "-" ? 0 : Math.max(d > 0 ? 1 : 0, Math.round(numOr0(d) / max * 80));
    return `<div><span class="p" title="${esc(p)}"><bdi>${hl(p)}</bdi></span><span class="a">${a === "-" ? "bin" : "+" + a}</span><span class="d">${d === "-" ? "" : "−" + d}</span><span class="bar"><span class="ba" style="width:${wa}px"></span><span class="bd" style="width:${wd}px"></span></span></div>`;
  }).join("");
}
function detail(c) {
  let fa = 0, fd = 0; c.f.forEach(f => { fa += numOr0(f[1]); fd += numOr0(f[2]); });
  const parents = c.p.map(p => `<a href="#" data-jump="${p}">${short(p)}</a>`).join(", ") || "none (first commit)";
  return `<div class="meta"><span>${esc(c.a)} · ${new Date(c.d).toLocaleString()}</span><span>${c.f.length} files, <span style="color:var(--add)">+${fa}</span> <span style="color:var(--del)">−${fd}</span>${c.p.length > 1 ? " (against first parent)" : ""}</span><span>Parents: ${parents}</span><a href="${REPO}/commit/${c.h}" target="_blank" rel="noopener">Open on GitHub ↗</a>${c.pr.n ? `<a href="${REPO}/pull/${c.pr.n}" target="_blank" rel="noopener">PR #${c.pr.n} ↗</a>` : ""}</div>`
    + (c.b ? `<p class="body">${hl(c.b)}</p>` : "")
    + `<div class="files">${fileRows(c)}</div>`;
}
function commitRow(c, withGraph) {
  const refs = c.r.map(r => `<span class="ref${r === "main" ? " trunk" : ""}">${esc(r)}</span>`).join("");
  const tag = c.pr.n ? `<span class="tag" style="--c:${c.pr.color}">#${c.pr.n}</span>` : "";
  const g = withGraph ? `<div class="graph">${graphSvg(c, c.i)}</div>` : `<div><div class="dot" style="--c:${c.pr.color}"></div></div>`;
  return `<div class="commit${c.p.length > 1 ? " merge" : ""}${open.has(c.h) ? " open" : ""}" data-h="${c.h}" tabindex="0" role="button" aria-expanded="${open.has(c.h)}">${g}
    <div class="main"><div class="subj">${refs}${withGraph ? tag : ""}${hl(c.s)}</div><span class="who${isClaude(c) ? " claude" : ""}">${esc(c.a)}</span><span class="when">${fmtDate(c.d)}</span><span class="hash">${short(c.h)}</span></div>
    <div class="detail">${open.has(c.h) ? detail(c) : ""}</div></div>`;
}
function render() {
  const list = document.getElementById("list");
  document.querySelector(".wrap").style.setProperty("--gw", GW + "px");
  let shown = 0;
  if (state.view === "graph") {
    list.innerHTML = DATA.map(c => commitRow(c, true)).join("");
    list.querySelectorAll(".commit").forEach(el => {
      const ok = matches(byHash.get(el.dataset.h)); if (ok) shown++;
      el.classList.toggle("dim", !ok && !state.only); el.classList.toggle("hide", !ok && state.only);
    });
  } else {
    list.innerHTML = groups.filter(g => !state.pr || g === state.pr).map(g => {
      const cs = g.commits.filter(matches); shown += cs.length;
      if (!cs.length) return "";
      let a = 0, d = 0; g.commits.forEach(c => { if (c.p.length < 2) c.f.forEach(f => { a += numOr0(f[1]); d += numOr0(f[2]); }); });
      const first = g.commits[g.commits.length - 1].d.slice(0, 10), last = g.commits[0].d.slice(0, 10);
      return `<details class="pr" style="--c:${g.color}" open><summary><span class="num">${g.n ? "#" + g.n : "—"}</span><div><h3>${esc(g.title)}</h3><div class="pm">${esc(g.branch)} · ${g.commits.length} commits · ${first === last ? first : first + " → " + last}</div></div><span class="pm"><span style="color:var(--add)">+${a.toLocaleString()}</span> <span style="color:var(--del)">−${d.toLocaleString()}</span></span></summary><div class="inner">${cs.map(c => commitRow(c, false)).join("")}</div></details>`;
    }).join("");
  }
  document.getElementById("count").textContent = shown === DATA.length ? `${DATA.length} commits` : `${shown} of ${DATA.length} commits match`;
}
function renderChips() {
  document.getElementById("chips").innerHTML = groups.map((g, i) =>
    `<button class="chip" data-g="${i}" style="--c:${g.color}" aria-pressed="${state.pr === g}" title="${esc(g.title)}"><i></i>${g.n ? "#" + g.n : "main"} <span class="n">${g.commits.length}</span></button>`).join("");
}
function setSeg(id, attr, val) { document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === val)); }

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.getElementById("only").addEventListener("change", e => { state.only = e.target.checked; render(); });
document.getElementById("who").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.who = b.dataset.a; setSeg("who", "a", state.who); render(); });
document.getElementById("view").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; setSeg("view", "v", state.view); try { localStorage.setItem("sbcs-history-view", state.view); } catch (err) {} render(); });
document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; const g = groups[+b.dataset.g]; state.pr = state.pr === g ? null : g; renderChips(); render(); });
function toggle(el) {
  const h = el.dataset.h, c = byHash.get(h);
  if (open.has(h)) { open.delete(h); el.classList.remove("open"); }
  else { open.add(h); el.classList.add("open"); el.querySelector(".detail").innerHTML = detail(c); }
  el.setAttribute("aria-expanded", open.has(h));
}
document.getElementById("list").addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); const t = document.querySelector(`.commit[data-h="${j.dataset.jump}"]`); if (t) { if (!open.has(t.dataset.h)) toggle(t); t.scrollIntoView({block: "center"}); t.focus(); } return; }
  if (e.target.closest("a, .detail")) return;
  const el = e.target.closest(".commit"); if (el) toggle(el);
});
document.getElementById("list").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("commit")) { e.preventDefault(); toggle(e.target); }
});
setSeg("view", "v", state.view);
renderChips(); render();
</script>
