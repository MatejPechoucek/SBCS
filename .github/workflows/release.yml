name: Release

# Builds the mod and attaches the jar to a GitHub Release named after mod_version.
#
# Three ways in:
# - push a tag v<mod_version> (e.g. v0.4.0-alpha) - the tag must match gradle.properties;
# - push to main a commit that changes mod_version in gradle.properties - the tag is made here;
# - run it by hand (Actions > Release > Run workflow) to release the version on main now.
# A version that already has a release is left alone, so re-running is safe.
#
# The notes are the "### Changelog" block of that version's section in docs/modrinth.md, or
# GitHub's generated notes when there is none. -alpha and -beta versions are pre-releases.
on:
  push:
    branches: [main]
    paths: [gradle.properties]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Work out the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          go=true
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            before=$(git show HEAD^:gradle.properties 2>/dev/null | sed -n 's/^mod_version=//p' | tr -d '\r')
            if [ "$before" = "$version" ]; then
              echo "mod_version is still $version - nothing to release"
              go=false
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            go=false
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.v.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.go == 'true'
      - name: Build
        if: steps.v.outputs.go == 'true'
        run: ./gradlew build --no-daemon

      - name: Pick the jar
        if: steps.v.outputs.go == 'true'
        id: jar
        run: |
          jar="build/libs/sbcs-${{ steps.v.outputs.version }}.jar"
          if [ ! -f "$jar" ]; then echo "::error::$jar was not built"; ls build/libs; exit 1; fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Release notes from docs/modrinth.md
        if: steps.v.outputs.go == 'true'
        id: notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # The fenced block after "### Changelog", inside "## Version <version>".
          awk -v want="## Version $VERSION" '
            /^## / { inside = ($0 == want); next }
            inside && /^### Changelog/ { cl = 1; next }
            inside && cl && /^```/ { if (fence) exit; fence = 1; next }
            inside && cl && fence { print }
          ' docs/modrinth.md > notes.md
          if [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changelog for $VERSION in docs/modrinth.md - GitHub will generate the notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        if: steps.v.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          args=(--title "SBCS $VERSION" --target "$GITHUB_SHA")
          if [ "${{ steps.notes.outputs.found }}" = true ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          if [ "${{ steps.v.outputs.pre }}" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" "${args[@]}"
